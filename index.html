<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2c12e">
<meta name="description" content="Generatore di tiare stampabili in 3D con scritta personalizzata.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier Tiara">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; }
:root { box-sizing: border-box; height: 100%; }
</style>
</head>
<body>
<title>Atelier Tiara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco di lavoro — anteprima 3D a sinistra, scheda parametri a destra (su telefono una sotto l'altra) */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --sunk: #eceae3; --ink: #1f1c15; --muted: #6b665a; --line: #e2dfd5;
  --accent: #f2c12e; --accent-text: #8a6500; --accent-ink: #231c02; --accent-soft: #fbf0c8;
  --metal: #cfd1d8; --amber: #d98a3a;
  --ok: #2f8a58; --warn: #a96b12; --err: #b3261e; --info: #4a5f8a;
  --beg: #3aa35b; --mid: #d9a800; --exp: #d4483a;
  --stage: #ebeae5;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-script: "TiaraScript", "Segoe Script", cursive;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13120f; --panel: #1b1a16; --sunk: #25231d; --ink: #eeebe2; --muted: #a8a294; --line: #302d25;
  --accent: #f3c544; --accent-text: #f3c544; --accent-ink: #1d1803; --accent-soft: #3a3115; --metal: #c9ccd4; --amber: #e59b4f;
  --ok: #5cc68b; --warn: #e2a64a; --err: #f07a72; --info: #8fa6d6; --stage: #161511; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13120f; --panel: #1b1a16; --sunk: #25231d; --ink: #eeebe2; --muted: #a8a294; --line: #302d25;
  --accent: #f3c544; --accent-text: #f3c544; --accent-ink: #1d1803; --accent-soft: #3a3115; --metal: #c9ccd4; --amber: #e59b4f;
  --ok: #5cc68b; --warn: #e2a64a; --err: #f07a72; --info: #8fa6d6; --stage: #161511; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-script); font-weight: 400; font-size: 30px; line-height: 1; color: var(--accent-text); }
.brand span { color: var(--muted); font-size: 12.5px; }
.modes { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 13px; color: var(--muted); }
.modes button .dot { width: 9px; height: 9px; border-radius: 50%; }
.modes button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
.toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.status { margin-left: auto; font-family: var(--f-num); font-size: 12px; padding: 5px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: inline-flex; gap: 8px; align-items: center; }
.status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.busy .led { background: var(--amber); animation: pulse 1s infinite; }
.status.bad .led { background: var(--err); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status.busy .led { animation: none; } }

.readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.readout div { background: var(--panel); padding: 9px 14px; min-width: 0; }
.readout dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.readout dd { margin: 2px 0 0; font-family: var(--f-num); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.panel { min-height: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.panel-body { padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
.notes { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
.note { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); border-left: 3px solid var(--info); }
.note.warn { border-left-color: var(--warn); }
.note.error { border-left-color: var(--err); }
.note.ok { border-left-color: var(--ok); }

details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary { list-style: none; cursor: pointer; padding: 14px 0 10px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 13.5px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
details.sec[open] > summary::after { transform: rotate(-135deg); }
.fields { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field[hidden] { display: none; }
.field.dim { opacity: .45; }
.lab { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; }
.lab .lv { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.lab .val { margin-left: auto; font-family: var(--f-num); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.help { font-size: 12px; color: var(--muted); }
.textin { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r); padding: 8px 12px; font-family: var(--f-script); font-size: 30px; line-height: 1.25; }
.textin:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.row { display: flex; gap: 10px; align-items: center; }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
input[type=number] { width: 78px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 5px 7px; font-family: var(--f-num); font-size: 13px; text-align: right; }
select { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 7px 9px; }
.seg { display: flex; flex-wrap: wrap; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { flex: 1 1 auto; border: 0; background: none; border-radius: 7px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .14); font-weight: 500; }
.tog { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
.tog input { appearance: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.tog input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .15s; }
.tog input:checked { background: var(--accent); }
.tog input:checked::after { transform: translateX(15px); }

.foot { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.btn { border: 0; border-radius: var(--r); padding: 11px 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-size: 14px; }
.btn:disabled { opacity: .55; cursor: progress; }
.dl { display: flex; gap: 8px; flex-wrap: wrap; }
.dl .btn { flex: 1 1 auto; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--accent); flex: 0 1 auto; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; }
.links button, .links label { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.foot .msg { font-size: 12.5px; color: var(--muted); min-height: 1em; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .stage { height: 58svh; min-height: 340px; }
  .panel { border-left: 0; overflow: visible; }
  .readout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel-body, .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand span { display: none; }
  .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; top: 8px; left: 8px; right: 8px; }
  .toolbar::-webkit-scrollbar { display: none; }
  .chip, .status { flex: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Atelier Tiara</b><span>tiara parametrica con scritta, pronta da stampare in piedi</span></div>
    <div class="modes" role="group" aria-label="Livello di dettaglio">
      <button type="button" id="m1" data-mode="1"><i class="dot" style="background:var(--beg)"></i>Principiante</button>
      <button type="button" id="m2" data-mode="2"><i class="dot" style="background:var(--mid)"></i>Intermedio</button>
      <button type="button" id="m3" data-mode="3"><i class="dot" style="background:var(--exp)"></i>Esperto</button>
    </div>
  </header>
  <div class="main">
    <section class="stage" aria-label="Anteprima 3D">
      <canvas id="view"></canvas>
      <div class="toolbar">
        <button class="chip" type="button" data-view="front">Fronte</button>
        <button class="chip" type="button" data-view="iso">Tre quarti</button>
        <button class="chip" type="button" data-view="back">Retro</button>
        <button class="chip" type="button" data-view="top">Dall'alto</button>
        <button class="chip" type="button" id="toggleSup" aria-pressed="true">Supporti</button>
        <span class="status busy" id="status"><i class="led"></i><span id="statusTxt">Avvio del motore…</span></span>
      </div>
      <dl class="readout" id="readout">
        <div><dt>Ingombro sul piatto</dt><dd id="r-size">—</dd></div>
        <div><dt id="r-mass-l">Peso stimato</dt><dd id="r-mass">—</dd></div>
        <div><dt>Fascia interna / apertura</dt><dd id="r-band">—</dd></div>
        <div><dt>Serraggio per lato</dt><dd id="r-force">—</dd></div>
        <div><dt>Supporti</dt><dd id="r-sup">—</dd></div>
        <div><dt>Flessione infilandola</dt><dd id="r-strain">—</dd></div>
      </dl>
    </section>
    <aside class="panel" aria-label="Parametri">
      <div class="panel-body">
        <div class="notes" id="notes"></div>
        <form id="form" autocomplete="off"></form>
      </div>
      <div class="foot">
        <div class="dl">
          <button class="btn" type="button" id="download">Scarica la tiara (.zip)</button>
          <button class="btn ghost" type="button" id="downloadFit">Fascia di prova</button>
        </div>
        <div class="links">
          <button type="button" id="saveParams">Salva parametri</button>
          <label for="loadParams">Carica parametri</label><input type="file" id="loadParams" accept=".json,application/json" hidden>
          <button type="button" id="reset">Valori iniziali</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </div>
    </aside>
  </div>
</div>

  { k: 'supMerge', only: 'decorata', s: 'supporti', lv: 3, t: 'range', l: 'Distanza per unire i rami', u: 'mm', min: 0, max: 16, st: 0.5, sup: 1 },
  { k: 'supFootD', only: 'decorata', s: 'supporti', lv: 3, t: 'range', l: 'Diametro piede', u: 'mm', min: 3, max: 10, st: 0.5, sup: 1 },
  { k: 'supFootH', only: 'decorata', s: 'supporti', lv: 3, t: 'range', l: 'Altezza piede', u: 'mm', min: 0.2, max: 1.6, st: 0.1, sup: 1 },
  { k: 'supSide', only: 'decorata', s: 'supporti', lv: 3, t: 'seg', l: 'Lato dei tronchi', opts: [['auto', 'Automatico'], ['interno', 'Interno'], ['esterno', 'Esterno']], sup: 1 },
  { k: 'supMinLen', only: 'decorata', s: 'supporti', lv: 3, t: 'range', l: 'Sbalzo minimo da sostenere', u: 'mm', min: 0.3, max: 4, st: 0.1, sup: 1 },

  { k: 'printer', s: 'stampa', lv: 2, t: 'seg', l: 'Stampante', opts: [['mk4s', 'Prusa MK4S · ugello 0,4'], ['altra', 'Altra stampante']], help: 'Con la MK4S lo zip contiene anche un progetto PrusaSlicer (.3mf) con le impostazioni già sul pezzo.' },
  { pr: 'altra', k: 'bed', s: 'stampa', lv: 2, t: 'range', l: 'Lato del piatto', u: 'mm', min: 150, max: 400, st: 5 },
  { k: 'meshEdge', s: 'stampa', lv: 3, t: 'range', l: 'Precisione della mesh (spigolo max)', u: 'mm', min: 1.5, max: 8, st: 0.5, help: 'Vale per il file scaricato. Più piccolo = curve più fedeli e file più pesante.' },
];

// ------------------------------------------------------------ stato
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* spazio non disponibile */ } },
};
let P = { ...DEFAULTS, ...store.get('tiara.params', {}) };
let mode = store.get('tiara.mode', 1);
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 1) => Number(v).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
const decs = (st) => (st >= 1 ? 0 : st >= 0.1 ? 1 : 2);

// ------------------------------------------------------------ form
const form = $('form');
function buildForm() {
  form.innerHTML = '';
  for (const [sid, title] of SECTIONS) {
    const det = document.createElement('details');
    det.className = 'sec'; det.id = 'sec-' + sid; det.open = store.get('tiara.open.' + sid, sid !== 'stampa');
    det.addEventListener('toggle', () => store.set('tiara.open.' + sid, det.open));
    det.innerHTML = `<summary>${title}</summary><div class="fields"></div>`;
    const box = det.querySelector('.fields');
    for (const f of F.filter((x) => x.s === sid)) box.appendChild(fieldEl(f));
    form.appendChild(det);
  }
  applyMode();
}
const lvColor = ['', 'var(--beg)', 'var(--mid)', 'var(--exp)'];
function fieldEl(f) {
  const w = document.createElement('div');
  w.className = 'field'; w.dataset.k = f.k; w.dataset.lv = f.lv;
  const id = 'f-' + f.k;
  const val = P[f.k];
  const lab = `<span class="lab"><i class="lv" style="background:${lvColor[f.lv]}" title="${['', 'Principiante', 'Intermedio', 'Esperto'][f.lv]}"></i><label for="${id}">${f.l}</label>${f.t === 'range' ? `<span class="val" id="${id}-v"></span>` : ''}</span>`;
  if (f.t === 'text') {
    w.innerHTML = `${lab}<input class="textin" id="${id}" type="text" maxlength="40" spellcheck="false">`;
    const inp = w.querySelector('input'); inp.value = val;
    inp.addEventListener('input', () => set(f.k, inp.value));
  } else if (f.t === 'select') {
    w.innerHTML = `${lab}<select id="${id}">${f.opts.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select>`;
    const s = w.querySelector('select'); s.value = val;
    s.addEventListener('change', () => set(f.k, s.value));
  } else if (f.t === 'seg') {
    w.innerHTML = `${lab.replace(`<label for="${id}">`, `<label id="${id}">`)}<div class="seg" role="group" aria-labelledby="${id}">${f.opts.map(([v, n]) => `<button type="button" data-v="${v}" aria-pressed="${v === val}">${n}</button>`).join('')}</div>`;
    w.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      w.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      set(f.k, b.dataset.v);
    }));
  } else if (f.t === 'toggle') {
    w.innerHTML = `<label class="tog"><input type="checkbox" id="${id}"><span>${f.l}</span></label>`;
    const c = w.querySelector('input'); c.checked = !!val;
    c.addEventListener('change', () => set(f.k, c.checked));
  } else if (f.t === 'range') {
    w.innerHTML = `${lab}<div class="row"><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.st}" aria-describedby="${id}-v"><input type="number" id="${id}-n" min="${f.min}" max="${f.max}" step="${f.st}" aria-label="${f.l}"></div>`;
    const r = w.querySelector('input[type=range]'), n = w.querySelector('input[type=number]'), v = w.querySelector('.val');
    const show = (x) => { r.value = x; n.value = Number(x).toFixed(decs(f.st)); v.textContent = `${fmt(x, decs(f.st))} ${f.u}`; };
    show(val);
    r.addEventListener('input', () => { show(+r.value); set(f.k, +r.value); });
    n.addEventListener('change', () => { let x = Math.min(f.max, Math.max(f.min, +n.value || f.min)); show(x); set(f.k, x); });
  }
  if (f.help) { const h = document.createElement('div'); h.className = 'help'; h.textContent = f.help; w.appendChild(h); }
  return w;
}
function syncForm() {
  for (const f of F) {
    const w = form.querySelector(`[data-k="${f.k}"]`); if (!w) continue;
    const val = P[f.k], id = 'f-' + f.k;
    if (f.t === 'text' || f.t === 'select') $(id).value = val;
    else if (f.t === 'toggle') $(id).checked = !!val;
    else if (f.t === 'seg') w.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === String(val)));
    else if (f.t === 'range') { $(id).value = val; $(id + '-n').value = Number(val).toFixed(decs(f.st)); $(id + '-v').textContent = `${fmt(val, decs(f.st))} ${f.u}`; }
  }
  applyMode();
}
function applyMode() {
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.mode === mode));
  for (const w of form.querySelectorAll('.field')) {
    const f = F.find((x) => x.k === w.dataset.k);
    w.hidden = +w.dataset.lv > mode || (f.only && f.only !== P.model) || (f.pr && f.pr !== P.printer);
    w.classList.toggle('dim', !!f.sup && !P.supports);
  }
  for (const [sid] of SECTIONS) {
    const det = $('sec-' + sid);
    det.hidden = ![...det.querySelectorAll('.field')].some((w) => !w.hidden);
  }
  const mh = form.querySelector('[data-k="model"] .help');
  if (mh) mh.textContent = MODEL_HELP[P.model] || '';
  const selfM = P.model === 'autoportante';
  $('toggleSup').hidden = selfM;
  setTextFont();
}
function set(k, v) {
  if (k === 'model' && v !== P.model) {
    // i valori che l'utente non ha toccato seguono il modello scelto
    const from = MODEL_DEFAULTS[P.model] || {}, to = MODEL_DEFAULTS[v] || {};
    for (const key of Object.keys(to)) if (P[key] === from[key]) P[key] = to[key];
    P.model = v; store.set('tiara.params', P); syncForm(); schedule(); return;
  }
  P[k] = v;
  store.set('tiara.params', P);
  if (k === 'supports' || k === 'printer') applyMode();
  if (k === 'font') setTextFont();
  schedule();
}
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => { mode = +b.dataset.mode; store.set('tiara.mode', mode); applyMode(); }));

// font del campo testo = font scelto per la tiara
const loadedFaces = {};
async function loadFace(key) {
  if (loadedFaces[key]) return loadedFaces[key];
  loadedFaces[key] = (async () => {
    const buf = await (await fetch('fonts/' + FONTS[key].file)).arrayBuffer();
    const face = new FontFace('Tiara-' + key, buf);
    await face.load(); document.fonts.add(face);
    return 'Tiara-' + key;
  })().catch(() => null);
  return loadedFaces[key];
}
async function setTextFont() {
  const el = $('f-text'); if (!el) return;
  const fam = await loadFace(P.font);
  if (fam) el.style.fontFamily = `"${fam}", var(--f-script)`;
}
loadFace('great-vibes').then((fam) => { if (fam) document.documentElement.style.setProperty('--f-script', `"${fam}", "Segoe Script", cursive`); });

// ------------------------------------------------------------ vista 3D
const canvas = $('view');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { renderer = null; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 3000);
const group = new THREE.Group(); group.rotation.x = -Math.PI / 2; scene.add(group);
let controls, bedMesh, grid;
const matTiara = new THREE.MeshStandardMaterial({ color: 0xd9dbe2, metalness: 0.85, roughness: 0.3 });
const matSup = new THREE.MeshStandardMaterial({ color: 0xd98a3a, metalness: 0.0, roughness: 0.65, transparent: true, opacity: 0.92 });
let meshT = null, meshS = null, showSup = true, lastSize = [150, 160, 60];
if (renderer) {
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-120, 220, -260); scene.add(key);
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.target.set(0, 25, 0);
  const loop = () => { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); };
  new ResizeObserver(resize).observe(canvas);
  resize(); setView('iso'); loop();
} else {
  canvas.replaceWith(Object.assign(document.createElement('p'), { className: 'note warn', textContent: 'Il tuo browser non mostra la grafica 3D (WebGL). I file si scaricano comunque.' }));
}
function resize() {
  if (!renderer) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
function bed(size) {
  if (!renderer) return;
  if (bedMesh) { scene.remove(bedMesh); scene.remove(grid); }
  const c = getComputedStyle(document.documentElement);
  bedMesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color: new THREE.Color(c.getPropertyValue('--sunk').trim() || '#ddd'), transparent: true, opacity: 0.85 }));
  bedMesh.rotation.x = -Math.PI / 2; bedMesh.position.y = -0.05; scene.add(bedMesh);
  grid = new THREE.GridHelper(size, Math.round(size / 10), new THREE.Color(c.getPropertyValue('--muted').trim() || '#888'), new THREE.Color(c.getPropertyValue('--line').trim() || '#ccc'));
  grid.position.y = 0.02; scene.add(grid);
}
function setView(v) {
  const d = Math.max(lastSize[0], lastSize[1]) * 1.25 + 70;
  const t = new THREE.Vector3(0, lastSize[2] * 0.42, 0);
  const pos = { front: [0, t.y + 8, -d], back: [0, t.y + 30, d], iso: [-d * 0.38, d * 0.36, -d * 0.86], top: [0, d * 1.15, -1] }[v];
  camera.position.set(...pos); if (controls) { controls.target.copy(t); controls.update(); }
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
$('toggleSup').addEventListener('click', (e) => { showSup = !showSup; e.currentTarget.setAttribute('aria-pressed', showSup); if (meshS) meshS.visible = showSup; });
function toGeom(m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.vert, 3));
  g.setIndex(new THREE.BufferAttribute(m.tri, 1));
  const ng = g.toNonIndexed(); g.dispose(); ng.computeVertexNormals();
  return ng;
}
function showResult(r) {
  if (!renderer) return;
  if (meshT) { group.remove(meshT); meshT.geometry.dispose(); meshT = null; }
  if (meshS) { group.remove(meshS); meshS.geometry.dispose(); meshS = null; }
  meshT = new THREE.Mesh(toGeom(r.tiara), matTiara); group.add(meshT);
  if (r.supports) { meshS = new THREE.Mesh(toGeom(r.supports), matSup); meshS.visible = showSup; group.add(meshS); }
  const first = !lastSize.done;
  lastSize = [...r.stats.sizeAll]; lastSize.done = true;
  bed(P.bed);
  if (first) setView('iso');
}
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const retheme = () => bed(P.bed);
mq.addEventListener?.('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ------------------------------------------------------------ calcolo
const worker = new Worker('worker.js', { type: 'module' });
let seq = 0, running = null, pending = false, timer = null, lastStats = null;
function status(kind, txt) { const s = $('status'); s.className = 'status ' + kind; $('statusTxt').textContent = txt; }
function schedule() { clearTimeout(timer); timer = setTimeout(run, 380); }
function run() {
  if (running) { pending = true; return; }
  running = ++seq; pending = false;
  status('busy', 'Calcolo…');
  worker.postMessage({ id: running, kind: 'preview', params: { ...P } });
}
const waiters = {};
worker.onmessage = (e) => {
  const d = e.data;
  if (d.kind === 'export' || d.kind === 'fit') { waiters[d.id]?.(d); delete waiters[d.id]; return; }
  if (d.id !== running) return;
  const r = d.result;
  running = null;
  if (r.ok) { showResult(r); report(r); status(r.stats.bodies > 1 ? 'bad' : '', `Pronto · ${fmt(r.stats.ms / 1000, 1)} s`); }
  else { status('bad', 'Errore di calcolo'); notes([{ level: 'error', msg: 'Non sono riuscito a generare la tiara con questi valori. Riporta un parametro verso il valore iniziale.' }]); console.error(r.error); }
  if (pending) run();
};
worker.onerror = (e) => { status('bad', 'Motore non avviato'); notes([{ level: 'error', msg: 'Il motore di calcolo non si è avviato in questo browser. Prova con Chrome, Edge, Firefox o Safari aggiornati.' }]); };

function notes(list) {
  const box = $('notes'); box.innerHTML = '';
  for (const w of list) { const d = document.createElement('div'); d.className = 'note ' + w.level; d.textContent = w.msg; box.appendChild(d); }
}
function report(r) {
  const s = r.stats; lastStats = s;
  $('r-size').textContent = `${fmt(s.sizeAll[0], 0)}×${fmt(s.sizeAll[1], 0)}×${fmt(s.sizeAll[2], 0)} mm`;
  $('r-mass').textContent = s.supMass ? `${fmt(s.mass, 1)} g + ${fmt(s.supMass, 1)} g` : `${fmt(s.mass, 1)} g`;
  $('r-mass-l').textContent = s.supMass ? 'Peso tiara + supporti' : 'Peso stimato';
  $('r-band').textContent = `${fmt(s.band.inner, 0)} / ${fmt(s.band.opening, 0)} mm`;
  $('r-force').textContent = `${fmt(s.spring.force, 1)} N`;
  $('r-strain').textContent = `${fmt(s.spring.strainOn * 100, 1)}% (lim. ${P.material === 'PLA' ? '2' : '3,5'}%)`;
  $('r-sup').textContent = P.model === 'autoportante' ? 'Nessuno: autoportante' : P.supports ? `${s.trunks} alberi, ${s.contacts} punte` : `${s.contacts} punti (slicer)`;
  const list = [...r.warnings];
  const bedTxt = P.printer === 'mk4s' ? 'nel piatto della MK4S' : `nel piatto da ${P.bed} mm`;
  if (!list.some((w) => w.level === 'error' || w.level === 'warn')) list.unshift({ level: 'ok', msg: P.model === 'autoportante' ? `Stampabile in piedi senza supporti: un pezzo unico, entra ${bedTxt}.` : `Stampabile: un pezzo unico, entra ${bedTxt}.` });
  notes(list);
}

// ------------------------------------------------------------ download e parametri
// Dentro claude.ai il salvataggio passa dalla funzione "downloads" della piattaforma (con conferma);
// fuori (versione pubblicata su un tuo sito) si usa il normale download del browser.
const inClaude = !!window.claude;
let downloads = null;
(async () => {
  if (!inClaude) return;
  try { downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }
  if (!downloads) $('msg').textContent = 'In questa vista il salvataggio dei file non è disponibile.';
})();
async function saveFile(filename, data) {
  if (inClaude) {
    if (!downloads) throw { code: 'unavailable' };
    return downloads.save({ filename, data });
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return { status: 'saved' };
}
if (!inClaude && 'serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* senza cache offline: l'app funziona lo stesso */ });
}
function exportZip(kind = 'export') {
  return new Promise((res) => { const id = ++seq; waiters[id] = res; worker.postMessage({ id, kind, params: { ...P } }); });
}
async function doDownload(kind, btn, waitMsg) {
  if (inClaude && !downloads) { $('msg').textContent = 'In questa vista il salvataggio dei file non è disponibile.'; return; }
  $('download').disabled = $('downloadFit').disabled = true; $('msg').textContent = waitMsg;
  const d = await exportZip(kind);
  $('download').disabled = $('downloadFit').disabled = false;
  if (!d.ok) { $('msg').textContent = 'Non sono riuscito a creare i file con questi valori.'; return; }
  try {
    await saveFile(d.filename, d.zip);
    $('msg').textContent = `Salvato ${d.filename} (${fmt(d.zip.size / 1048576, 1)} MB).`;
  } catch (err) {
    $('msg').textContent = err && err.code === 'declined' ? 'Salvataggio annullato.' : 'Il salvataggio non è riuscito. Riprova tra poco.';
  }
}
$('download').addEventListener('click', (e) => doDownload('export', e.currentTarget, P.printer === 'mk4s' ? 'Preparo STL e progetto PrusaSlicer in qualità piena…' : 'Preparo i file in qualità piena…'));
$('downloadFit').addEventListener('click', (e) => doDownload('fit', e.currentTarget, 'Preparo la fascia di prova…'));
$('saveParams').addEventListener('click', async () => {
  if (inClaude && !downloads) { $('msg').textContent = 'In questa vista il salvataggio dei file non è disponibile.'; return; }
  const clean = Object.fromEntries(Object.entries(P).filter(([k]) => k in DEFAULTS));
  try { await saveFile('tiara-parametri.json', new Blob([JSON.stringify({ app: 'Atelier Tiara', versione: 1, parametri: clean }, null, 2)], { type: 'application/json' })); $('msg').textContent = 'Parametri salvati.'; }
  catch (err) { $('msg').textContent = err && err.code === 'declined' ? 'Salvataggio annullato.' : 'Il salvataggio non è riuscito.'; }
});
$('loadParams').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const p = j.parametri || j;
    for (const k of Object.keys(DEFAULTS)) if (k in p) P[k] = p[k];
    store.set('tiara.params', P); syncForm(); schedule();
    $('msg').textContent = `Parametri caricati da ${f.name}.`;
  } catch (err) { $('msg').textContent = 'Il file non contiene parametri validi di Atelier Tiara.'; }
  e.target.value = '';
});
$('reset').addEventListener('click', () => { P = { ...DEFAULTS }; store.set('tiara.params', P); syncForm(); schedule(); $('msg').textContent = 'Valori iniziali ripristinati.'; });

buildForm();
run();
</script>

</body>
